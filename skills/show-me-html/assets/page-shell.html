<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Page title</title>
<script>
  // Applies the saved theme and text size before the first paint, so the page does not flash.
  (function () {
    var d = document.documentElement;
    try {
      var t = localStorage.getItem('doc-theme');
      if (t === 'light' || t === 'dark') d.setAttribute('data-theme', t);
      var s = Number(localStorage.getItem('doc-scale'));
      if (s >= 0.875 && s <= 1.5) d.style.setProperty('--scale', s);
    } catch (e) { /* storage blocked: defaults apply */ }
  })();
</script>
<style>
/* ---------- Tokens: light, then dark for "auto" and for an explicit choice ---------- */
:root {
  --scale: 1;
  --bg: #fbf8ff; --surface: #ffffff; --surface-2: #f3eefc; --line: #e4ddf2;
  --text: #1c1a22; --muted: #5d5868; --primary: #6750a4; --primary-soft: #e9ddff;
  --on-primary-soft: #4f378b; --warn: #8a5300; --warn-soft: #ffe2bd; --err: #b3261e;
  --err-soft: #f9dedc; --ok: #1f6b3a; --ok-soft: #d4f1dc; --code-bg: #f1ecf9;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial,
          "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141218; --surface: #1d1b22; --surface-2: #26232d; --line: #38343f;
    --text: #e8e3ee; --muted: #b0a9bb; --primary: #cfbcff; --primary-soft: #3b2f5c;
    --on-primary-soft: #e9ddff; --warn: #ffb95c; --warn-soft: #4a3214; --err: #f2b8b5;
    --err-soft: #5a1d19; --ok: #8fd9a6; --ok-soft: #1b3d26; --code-bg: #2a2632;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141218; --surface: #1d1b22; --surface-2: #26232d; --line: #38343f;
  --text: #e8e3ee; --muted: #b0a9bb; --primary: #cfbcff; --primary-soft: #3b2f5c;
  --on-primary-soft: #e9ddff; --warn: #ffb95c; --warn-soft: #4a3214; --err: #f2b8b5;
  --err-soft: #5a1d19; --ok: #8fd9a6; --ok-soft: #1b3d26; --code-bg: #2a2632;
  color-scheme: dark;
}

/* ---------- Text size: every text size is in rem, so one root value scales the page ---------- */
html { font-size: calc(100% * var(--scale)); -webkit-text-size-adjust: 100%; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 1rem/1.5 var(--font); font-synthesis: none; overflow-wrap: anywhere; }
main { max-width: 57.5rem; margin: 0 auto; padding: 1.5rem 1rem 6rem; display: flex; flex-direction: column; gap: 3rem; }
/* Flex and grid children may shrink below their content, so a wide table scrolls inside its
   .scroll wrapper instead of widening the whole page. */
main > *, main section > *, .card > * { min-width: 0; }
h1 { font-size: 2rem; line-height: 1.25; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.5rem; line-height: 1.33; margin: 0; font-weight: 700; }
h3 { font-size: 1.125rem; line-height: 1.55; margin: 0; font-weight: 700; }
p { margin: 0; }
/* Lines of running text stop at about 72 characters, so the eye finds the next line. */
main :where(p, li) { max-width: 72ch; }
/* Section link: the "#" after each h2 goes to the section and copies its link. */
.h-anchor { display: inline-block; min-width: 1.5rem; margin-left: 0.25rem; border-radius: 0.25rem; text-align: center;
  color: var(--muted); font-weight: 400; text-decoration: none; opacity: 0; transition: opacity .15s cubic-bezier(0,0,.2,1); }
h2:hover .h-anchor, .h-anchor:focus-visible { opacity: 1; }
.h-anchor:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
@media (hover: none) { .h-anchor { opacity: .5; } }
.h-anchor.is-copied { opacity: 1; color: var(--ok); font-size: 0.875rem; font-weight: 700; }
.small { font-size: 0.875rem; line-height: 1.43; }
:lang(zh) body, body:lang(zh) { line-height: 1.75; }

/* ---------- Page bar and contents ----------
   One slim sticky bar that tells the reader where they are: the page title (only after the h1
   has scrolled away, so it never shows twice), the section they are in, and a reading-progress
   line along its bottom edge. On a touch screen it slides up while the reader scrolls down and
   comes back when they scroll up; on a desktop it always stays.
   Contents: a dropdown below 1200 px; a fixed side list at 1200 px and wider, so a desktop reader
   can jump without opening a menu. Theme and text size sit behind one "Aa" button: readers set
   them once, so they do not take space in the bar.
   In px on purpose: the bar and the side list keep one size at every text size. */
.doc-bar { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line);
  transition: transform .2s cubic-bezier(.4,0,.2,1); }
.doc-bar.is-hidden:not(:focus-within) { transform: translateY(-100%); }
/* With a mouse or trackpad (a desktop), the screen is tall enough: the bar always stays. */
@media (hover: hover) and (pointer: fine) { .doc-bar.is-hidden:not(:focus-within) { transform: none; } }
.bar-inner { position: relative; max-width: 1200px; margin: 0 auto; display: flex; align-items: center; gap: 8px; padding: 4px 16px; }
.bar-progress { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--primary);
  transform-origin: 0 50%; transform: scaleX(0); }
.doc-bar button { display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  font: 500 14px/20px var(--font); min-width: 44px; min-height: 44px; padding: 0 12px; border: 0; border-radius: 8px;
  background: none; color: var(--text); cursor: pointer; transition: background-color .15s cubic-bezier(0,0,.2,1); }
.doc-bar button[aria-expanded="true"] { background: var(--primary-soft); color: var(--on-primary-soft); }
.doc-bar button:focus-visible, .toc a:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
.doc-bar button:disabled { opacity: .4; cursor: not-allowed; }
.ico { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
/* Where the reader is: "Page title / Current section". */
.bar-where { flex: 1; min-width: 0; margin: 0; display: flex; align-items: baseline; gap: 8px; font: 14px/20px var(--font);
  white-space: nowrap; }
.bar-title, .bar-section { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.bar-title { flex: 0 1 auto; font-weight: 700; color: var(--text); opacity: 0; transition: opacity .2s cubic-bezier(0,0,.2,1); }
.bar-where.is-past-title .bar-title { opacity: 1; }
.bar-where:not(.is-past-title) .bar-sep { visibility: hidden; }
.bar-section { flex: 0 10 auto; color: var(--muted); }
.bar-sep { color: var(--muted); }
.bar-section:empty, .bar-where:has(.bar-section:empty) .bar-sep { display: none; }
/* Dropdowns: contents on the left, display settings on the right. */
.pop { position: absolute; top: calc(100% + 8px); z-index: 11; background: var(--surface); border: 1px solid var(--line);
  border-radius: 12px; box-shadow: 0 12px 32px rgb(0 0 0 / .16); max-height: calc(100vh - 80px); overflow-y: auto;
  animation: pop-in .25s cubic-bezier(0,0,.2,1); }
.pop[hidden] { display: none; }
@keyframes pop-in { from { opacity: 0; transform: translateY(-4px); } }
.pop-contents { left: 16px; width: min(360px, calc(100vw - 32px)); padding: 8px; }
.pop-settings { right: 16px; width: min(296px, calc(100vw - 32px)); padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.pop-label { font: 700 12px/16px var(--font); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 8px; }
.seg { display: flex; align-items: center; padding: 4px; gap: 4px; border-radius: 12px; background: var(--surface-2); }
.seg button { flex: 1; }
.doc-bar .seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); font-weight: 700;
  box-shadow: 0 1px 3px rgb(0 0 0 / .12); }
.size-value { flex: 1; text-align: center; font: 700 14px/20px var(--font); font-variant-numeric: tabular-nums; }
/* Contents list: one column, in reading order. The side list uses the same markup. */
.toc { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.toc a { display: flex; align-items: center; min-height: 44px; padding: 8px 12px; border-radius: 8px;
  color: var(--text); text-decoration: none; font: 14px/20px var(--font); transition: background-color .15s cubic-bezier(0,0,.2,1); }
.toc a[aria-current="true"] { background: var(--primary-soft); color: var(--on-primary-soft); font-weight: 700; }
@media (hover: hover) {
  .doc-bar button:hover:not([aria-expanded="true"]):not([aria-pressed="true"]):not(:disabled),
  .toc a:hover:not([aria-current="true"]) { background: var(--surface-2); }
}
/* Side list at 1200 px and wider. A line on its left marks the current section. */
.toc-side { display: none; }
@media (min-width: 1200px) {
  .layout { display: grid; grid-template-columns: 224px minmax(0, 57.5rem); justify-content: center; gap: 48px; padding: 0 16px; }
  .layout > main { margin: 0; padding-left: 0; padding-right: 0; }
  .toc-side { display: block; position: sticky; top: 64px; align-self: start; max-height: calc(100vh - 64px);
    overflow-y: auto; padding: 24px 0; }
  .toc-side .pop-label { padding-left: 16px; }
  .toc-side .toc { gap: 0; border-left: 1px solid var(--line); }
  .toc-side .toc a { min-height: 36px; padding: 8px 12px 8px 16px; margin-left: -1px; border-radius: 0 8px 8px 0;
    border-left: 2px solid transparent; color: var(--muted); }
  .toc-side .toc a[aria-current="true"] { background: none; color: var(--primary); border-left-color: var(--primary); }
  .doc-bar .nav-btn { display: none; }
}
/* PDF help: the print window does not say "PDF" by default when a real printer is the default,
   so the PDF button first says where "Save as PDF" is. "Do not show this again" is saved. */
.pdf-dialog { width: min(400px, calc(100vw - 32px)); padding: 24px; border: 1px solid var(--line); border-radius: 16px;
  background: var(--surface); color: var(--text); box-shadow: 0 12px 32px rgb(0 0 0 / .24); font: 14px/20px var(--font); }
.pdf-dialog::backdrop { background: rgb(0 0 0 / .4); }
.pdf-dialog[open] { display: flex; flex-direction: column; gap: 16px; animation: pop-in .25s cubic-bezier(0,0,.2,1); }
.pdf-dialog h2 { font: 700 18px/28px var(--font); margin: 0; }
.pdf-dialog ol { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }
.pdf-dialog .note { color: var(--muted); margin: 0; }
.pdf-dialog label { display: flex; align-items: center; gap: 8px; min-height: 44px; cursor: pointer; }
.pdf-dialog input { width: 18px; height: 18px; margin: 0; accent-color: var(--primary); }
.pdf-dialog .actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.pdf-dialog button { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; min-width: 80px;
  padding: 0 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--text);
  font: 500 14px/20px var(--font); cursor: pointer; }
.pdf-dialog button.primary { background: var(--primary); border-color: var(--primary); color: var(--surface); }
.pdf-dialog button:focus-visible, .pdf-dialog input:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
@media (hover: hover) { .pdf-dialog button:not(.primary):hover { background: var(--surface-2); } }
/* A section heading reached from the contents is not hidden under the bar. */
main [id] { scroll-margin-top: 72px; }
/* Phone: the bar names only the current section, in full weight. */
@media (max-width: 40rem) {
  .bar-title, .bar-sep, .pdf-btn span { display: none; }
  .bar-section { color: var(--text); font-weight: 700; }
}

/* ---------- Phone width ---------- */
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.scroll-hint { display: none; }
@media (max-width: 40rem) {
  main { gap: 2rem; }
  h1 { font-size: 1.625rem; }
  h2 { font-size: 1.25rem; }
  .scroll-hint { display: block; font-size: 0.75rem; color: var(--muted); }
}

/* ---------- Scrolling: the contents links scroll smoothly unless the reader asks for less motion ---------- */
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
/* ---------- Print and PDF ----------
   The PDF button calls window.print(); the reader picks "Save as PDF" as the printer.
   The PDF file name comes from <title>. On paper the page is always light, at one text size,
   without the bar, the side list and the controls. Mark a part that only works on screen
   (a slider, a "Try it" box) with .no-print; mark a part only for paper with .print-only. */
.print-only { display: none; }
@media print {
  :root:root:root { --bg: #ffffff; --surface: #ffffff; --surface-2: #f3eefc; --line: #e4ddf2;
    --text: #1c1a22; --muted: #5d5868; --primary: #6750a4; --primary-soft: #e9ddff;
    --on-primary-soft: #4f378b; --warn: #8a5300; --warn-soft: #ffe2bd; --err: #b3261e;
    --err-soft: #f9dedc; --ok: #1f6b3a; --ok-soft: #d4f1dc; --code-bg: #f1ecf9;
    color-scheme: light; }
  @page { margin: 16mm 14mm; }
  html { font-size: 87.5% !important; }
  body { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  .doc-bar, .toc-side, .scroll-hint, .h-anchor, .no-print { display: none !important; }
  .print-only { display: block; }
  .layout { display: block; padding: 0; }
  main { max-width: none; margin: 0; padding: 0; gap: 2rem; }
  .scroll { overflow: visible; }
  .scroll > svg { min-width: 0 !important; }
  h2, h3 { break-after: avoid; }
  .card, .callout, .based-on, tr, svg, li { break-inside: avoid; }
  main a[href^="http"]::after { content: " (" attr(href) ")"; font-size: 0.75rem; color: var(--muted); }
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
.print-meta { max-width: none; font-size: 0.75rem; line-height: 1rem; color: var(--muted); padding-bottom: 0.5rem; border-bottom: 1px solid var(--line); }
</style>
</head>
<body>
<!-- Interface strings (bar, menus, PDF help, script text) follow the page language:
     see references/ui-strings.md. -->
<header class="doc-bar">
  <div class="bar-inner">
    <button type="button" class="nav-btn" aria-expanded="false" aria-controls="docNav">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span>Contents</span></button>
    <p class="bar-where" aria-hidden="true"><span class="bar-title"></span><span class="bar-sep">/</span><span class="bar-section"></span></p>
    <button type="button" class="pdf-btn" aria-label="Save as PDF" title="Save as PDF: in the print window, choose Save as PDF">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span>PDF</span></button>
    <button type="button" class="set-btn" aria-expanded="false" aria-controls="docSettings" aria-label="Display settings" title="Display settings">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 19 7.5 5h1L14 19M4.2 14h7.6M15 19l3.5-9h.5l3.5 9M16 16.5h5.5"/></svg></button>
    <!-- Both contents lists are built from each main section[id] and its h2; do not write them by hand. -->
    <nav class="pop pop-contents" id="docNav" aria-label="Contents" hidden><ol class="toc"></ol></nav>
    <div class="pop pop-settings" id="docSettings" role="group" aria-label="Display settings" hidden>
      <div><p class="pop-label" id="themeLabel">Theme</p>
        <div class="seg" role="group" aria-labelledby="themeLabel">
          <button type="button" data-theme-btn="auto" aria-pressed="true" title="Follow the system">Auto</button>
          <button type="button" data-theme-btn="light" aria-pressed="false">Light</button>
          <button type="button" data-theme-btn="dark" aria-pressed="false">Dark</button>
        </div></div>
      <div><p class="pop-label" id="sizeLabel">Text size</p>
        <div class="seg" role="group" aria-labelledby="sizeLabel">
          <button type="button" data-scale-btn="-1" aria-label="Smaller text">A−</button>
          <span class="size-value" aria-live="polite">100 %</span>
          <button type="button" data-scale-btn="1" aria-label="Larger text">A+</button>
        </div></div>
    </div>
  </div>
  <div class="bar-progress" aria-hidden="true"></div>
</header>
<dialog class="pdf-dialog" aria-labelledby="pdfTitle">
  <h2 id="pdfTitle">Save this page as a PDF</h2>
  <ol>
    <li>Click <b>Open print window</b>.</li>
    <li>In <b>Printer</b> or <b>Destination</b>, select <b>Save as PDF</b>.</li>
    <li>Click <b>Save</b>.</li>
  </ol>
  <p class="note">In Safari, click <b>PDF</b> at the bottom left, then <b>Save as PDF</b>.</p>
  <label><input type="checkbox" class="pdf-skip"> Do not show this again</label>
  <div class="actions">
    <button type="button" value="cancel">Cancel</button>
    <button type="button" class="primary" value="print">Open print window</button>
  </div>
</dialog>
<div class="layout">
<aside class="toc-side"><nav aria-label="Contents"><p class="pop-label">On this page</p><ol class="toc"></ol></nav></aside>
<main>
  <!-- Page content. A wide table or diagram goes in:
       <div class="scroll">…</div><p class="scroll-hint">Swipe sideways to see all of it.</p> -->
</main>
</div>
<script>
(function () {
  var d = document.documentElement;
  var save = function (k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };

  // Theme: Auto follows the system; Light and Dark override it.
  var themeBtns = document.querySelectorAll('[data-theme-btn]');
  var showTheme = function () {
    var cur = d.getAttribute('data-theme') || 'auto';
    themeBtns.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.themeBtn === cur)); });
  };
  themeBtns.forEach(function (b) {
    b.addEventListener('click', function () {
      var t = b.dataset.themeBtn;
      if (t === 'auto') d.removeAttribute('data-theme'); else d.setAttribute('data-theme', t);
      save('doc-theme', t === 'auto' ? null : t);
      showTheme();
    });
  });
  showTheme();

  // Text size: five steps from 87.5 % to 150 %. The value between the buttons shows the step.
  var STEPS = [0.875, 1, 1.125, 1.25, 1.5];
  var sizeBtns = document.querySelectorAll('[data-scale-btn]'), sizeOut = document.querySelector('.size-value');
  var scale = function () { return Number(getComputedStyle(d).getPropertyValue('--scale')) || 1; };
  var showSize = function () {
    var s = scale(), i = STEPS.indexOf(s);
    sizeOut.textContent = Math.round(s * 1000) / 10 + ' %';
    sizeBtns.forEach(function (b) {
      b.disabled = (b.dataset.scaleBtn === '-1' && i === 0) || (b.dataset.scaleBtn === '1' && i === STEPS.length - 1);
    });
  };
  sizeBtns.forEach(function (b) {
    b.addEventListener('click', function () {
      var i = STEPS.indexOf(scale());
      if (i < 0) i = 1;
      var next = STEPS[Math.min(STEPS.length - 1, Math.max(0, i + Number(b.dataset.scaleBtn)))];
      d.style.setProperty('--scale', next);
      save('doc-scale', next === 1 ? null : next);
      showSize();
    });
  });
  showSize();

  // Page bar. Both contents lists (dropdown and side) list every main section[id] by its h2.
  var bar = document.querySelector('.doc-bar'), side = document.querySelector('.toc-side');
  var navBtn = bar.querySelector('.nav-btn'), setBtn = bar.querySelector('.set-btn');
  var navPop = document.getElementById('docNav'), setPop = document.getElementById('docSettings');
  var where = bar.querySelector('.bar-where'), whereSection = bar.querySelector('.bar-section');
  var h1 = document.querySelector('main h1');
  if (h1) bar.querySelector('.bar-title').textContent = h1.textContent;
  var sections = Array.prototype.filter.call(document.querySelectorAll('main section[id]'),
    function (s) { return s.querySelector('h2'); });
  var titles = sections.map(function (s) { return s.querySelector('h2').textContent.trim(); });
  var links = [];
  document.querySelectorAll('.toc').forEach(function (list) {
    sections.forEach(function (s, i) {
      var li = document.createElement('li'), a = document.createElement('a');
      a.href = '#' + s.id; a.textContent = titles[i];
      li.append(a); list.append(li); links.push(a);
    });
  });

  // Section links: a "#" after each h2. It goes to the section and copies the section's link.
  sections.forEach(function (s, i) {
    var a = document.createElement('a');
    a.className = 'h-anchor'; a.href = '#' + s.id; a.textContent = '#';
    a.setAttribute('aria-label', 'Copy the link to ' + titles[i]);
    a.addEventListener('click', function () {
      if (!navigator.clipboard) return;
      navigator.clipboard.writeText(location.href.split('#')[0] + '#' + s.id).then(function () {
        a.textContent = 'Link copied'; a.classList.add('is-copied');
        setTimeout(function () { a.textContent = '#'; a.classList.remove('is-copied'); }, 1500);
      }, function () {});
    });
    s.querySelector('h2').append(a);
  });

  // PDF: the browser's print window makes the PDF. A line at the top of the paper says when.
  var meta = document.createElement('p');
  meta.className = 'print-only print-meta';
  document.querySelector('main').prepend(meta);
  window.addEventListener('beforeprint', function () {
    var t = new Date(), p = function (n) { return String(n).padStart(2, '0'); };
    meta.textContent = 'Exported on ' + t.getFullYear() + '-' + p(t.getMonth() + 1) + '-' + p(t.getDate()) +
      (/^https?:/.test(location.protocol) ? ' from ' + location.href.split('#')[0] : '') + '.';
  });
  if (!sections.length) { navBtn.hidden = true; side.hidden = true; }

  // One dropdown is open at a time. While one is open, the bar stays on screen.
  var pops = [[navBtn, navPop], [setBtn, setPop]];
  var setOpen = function (btn, pop, open) {
    btn.setAttribute('aria-expanded', String(open));
    pop.hidden = !open;
    if (!open) return;
    bar.classList.remove('is-hidden');
    pops.forEach(function (p) { if (p[1] !== pop) setOpen(p[0], p[1], false); });
    var cur = pop.querySelector('[aria-current="true"]');
    if (cur) cur.scrollIntoView({ block: 'nearest' });
  };
  var anyOpen = function () { return pops.some(function (p) { return !p[1].hidden; }); };
  pops.forEach(function (p) { p[0].addEventListener('click', function () { setOpen(p[0], p[1], p[1].hidden); }); });
  navPop.addEventListener('click', function (e) { if (e.target.closest('a')) setOpen(navBtn, navPop, false); });
  // PDF: first a short help that says where "Save as PDF" is, unless the reader turned it off.
  var pdfDlg = document.querySelector('.pdf-dialog'), pdfSkip = pdfDlg.querySelector('.pdf-skip');
  var printNow = function () { setTimeout(function () { window.print(); }, 50); };
  bar.querySelector('.pdf-btn').addEventListener('click', function () {
    pops.forEach(function (p) { setOpen(p[0], p[1], false); });
    var skip = false;
    try { skip = localStorage.getItem('doc-pdf-help') === 'off'; } catch (e) {}
    if (skip || !pdfDlg.showModal) printNow(); else pdfDlg.showModal();
  });
  pdfDlg.addEventListener('click', function (e) {
    var b = e.target.closest('button');
    // A click on the dimmed area outside the box closes it.
    var r = pdfDlg.getBoundingClientRect();
    if (e.target === pdfDlg && (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom)) pdfDlg.close();
    if (!b) return;
    pdfDlg.close();
    if (b.value !== 'print') return;
    if (pdfSkip.checked) save('doc-pdf-help', 'off');
    printNow();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    pops.forEach(function (p) { if (!p[1].hidden) { setOpen(p[0], p[1], false); p[0].focus(); } });
  });
  document.addEventListener('click', function (e) {
    if (!bar.contains(e.target)) pops.forEach(function (p) { setOpen(p[0], p[1], false); });
  });

  // On every scroll (once per frame): hide or show the bar, move the progress line, show the
  // title once the h1 is under the bar, and mark the current section. The current section is
  // the last one whose top has passed a line 30 % down the screen.
  var progress = bar.querySelector('.bar-progress'), lastY = window.scrollY, current, ticking = false;
  var update = function () {
    ticking = false;
    var y = window.scrollY, max = d.scrollHeight - window.innerHeight;
    progress.style.transform = 'scaleX(' + (max > 0 ? Math.min(1, y / max) : 0) + ')';
    if (Math.abs(y - lastY) >= 6) {
      if (anyOpen() || y < 80 || y < lastY) bar.classList.remove('is-hidden');
      else bar.classList.add('is-hidden');
      lastY = y;
    }
    where.classList.toggle('is-past-title', !h1 || h1.getBoundingClientRect().bottom < 56);
    // Over the last screen of the page the line moves down to the bottom edge, so the short
    // sections at the end also become current.
    var vh = window.innerHeight, left = Math.max(0, max - y), line = vh * 0.3, cur = null;
    if (left < vh) line += (vh - line) * (1 - left / vh);
    sections.forEach(function (s) { if (s.getBoundingClientRect().top <= line) cur = s; });
    if (cur === current) return;
    current = cur;
    whereSection.textContent = cur ? titles[sections.indexOf(cur)] : '';
    links.forEach(function (a) { a.setAttribute('aria-current', String(!!cur && a.hash === '#' + cur.id)); });
    var mark = side.querySelector('[aria-current="true"]');
    if (mark && getComputedStyle(side).display !== 'none') {
      var r = mark.getBoundingClientRect(), box = side.getBoundingClientRect();
      if (r.top < box.top || r.bottom > box.bottom) side.scrollTop += r.top - box.top - box.height / 2;
    }
  };
  window.addEventListener('scroll', function () { if (!ticking) { ticking = true; requestAnimationFrame(update); } }, { passive: true });
  window.addEventListener('resize', update);
  update();
})();
</script>
</body>
</html>
